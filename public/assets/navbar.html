<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; }

  .topbar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 64px; background: #1e293b; z-index: 30; align-items: center; padding: 0 20px; justify-content: space-between; }
  .logo { color: white; font-size: 20px; font-weight: 600; }
  .logo span { color: #fb923c; }

  .hamburger { display: flex; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
  .hamburger span { width: 24px; height: 3px; background: white; border-radius: 3px; transition: 0.3s; }
  .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; opacity: 0; transition: 0.3s; }
  .overlay.active { display: block; opacity: 1; }

  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; background: #1e293b; z-index: 50; display: flex; flex-direction: column; transition: 0.3s; }
  .sidebar-header { padding: 32px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .sidebar-nav { flex: 1; padding: 24px 0; overflow-y: auto; }

  .nav-item { display: flex; align-items: center; gap: 14px; padding: 16px 24px; color: #94a3b8; text-decoration: none; font-size: 15px; font-weight: 500; transition: 0.2s; position: relative; }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
  .nav-item.active { background: #fb923c; color: white; border-radius: 0 20px 20px 0; margin-right: 12px; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: -20px; width: 20px; height: 20px; background: transparent; border-bottom-right-radius: 20px; box-shadow: 0 10px 0 10px #fb923c; }
  .nav-item.active::after { content: ''; position: absolute; left: 0; bottom: -20px; width: 20px; height: 20px; background: transparent; border-top-right-radius: 20px; box-shadow: 0 -10px 0 10px #fb923c; }
  .nav-icon { width: 22px; height: 22px; opacity: 0.8; }
  .nav-item.active .nav-icon { opacity: 1; }

  .sidebar-footer { padding: 24px; border-top: 1px solid rgba(255,255,255,0.1); }
  .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; }
  .user-avatar { width: 40px; height: 40px; background: #fb923c; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px; }
  .user-details h4 { color: #e2e8f0; font-size: 14px; font-weight: 600; }

  .logout-btn { width: 100%; padding: 12px; background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
  .logout-btn:hover { background: rgba(239,68,68,0.25); color: #ef4444; }

  .main-content { margin-left: 280px; padding: 32px; min-height: 100vh; transition: 0.3s; }

  @media (max-width: 768px) {
    .topbar { display: flex; }
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-left: 0; padding: 20px; padding-top: 84px; }
  }
</style>
